name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HERMES_PIN: b200f5bc60e31588ba2cb60e288029c4a54ba5fa

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev mypy
      - run: uv run --group dev pytest -q

  hermes-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Hermes at the pinned release
        uses: ./.github/actions/install-hermes
        with:
          pin: ${{ env.HERMES_PIN }}
      - run: hermes --version
      - name: Plugin doctor loads the plugin through real discovery
        run: hermes plugins doctor . --ci
      - name: Catalog validation, as the catalog CI runs it
        run: hermes plugins validate --install-deps .
      - name: Draft catalog entry passes the catalog validator
        run: |
          entry_dir="$RUNNER_TEMP/plugin-catalog"
          mkdir -p "$entry_dir"
          sed "s/0000000000000000000000000000000000000000/$GITHUB_SHA/g" docs/catalog-entry.yaml > "$entry_dir/hermes-superagent.yaml"
          uv run --no-project --with ruamel.yaml==0.18.17 python "$RUNNER_TEMP/hermes-src/scripts/validate_plugin_catalog.py" "$entry_dir/hermes-superagent.yaml"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Hermes at the pinned release
        uses: ./.github/actions/install-hermes
        with:
          pin: ${{ env.HERMES_PIN }}
      - name: Real Hermes, fake model
        run: '"$RUNNER_TEMP/hermes-src/.venv/bin/python" tests/e2e/run_e2e.py --work "$RUNNER_TEMP/e2e"'
