name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --no-project --with-requirements requirements-dev.txt ruff check .
      - run: uv run --no-project --with-requirements requirements-dev.txt ruff format --check .
      - run: uv run --no-project --with-requirements requirements-dev.txt mypy
      - run: uv run --no-project --with-requirements requirements-dev.txt pytest -q

  hermes-compat:
    name: hermes-compat (${{ matrix.hermes.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hermes:
          - { version: "0.22.7", pin: b200f5bc60e31588ba2cb60e288029c4a54ba5fa }
          - { version: "0.23.0", pin: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Hermes at the pinned release
        uses: ./.github/actions/install-hermes
        with:
          pin: ${{ matrix.hermes.pin }}
      - run: hermes --version
      - name: Plugin doctor loads the plugin through real discovery
        run: hermes plugins doctor . --ci
      - name: Catalog validation, as the catalog CI runs it
        run: hermes plugins validate --install-deps .
      - name: Draft catalog entry passes the catalog validator
        run: |
          entry_dir="$RUNNER_TEMP/plugin-catalog"
          mkdir -p "$entry_dir"
          sed "s/0000000000000000000000000000000000000000/$GITHUB_SHA/g" docs/catalog-entry.yaml > "$entry_dir/hermes-superagent.yaml"
          uv run --no-project --with ruamel.yaml==0.18.17 python "$RUNNER_TEMP/hermes-src/scripts/validate_plugin_catalog.py" "$entry_dir/hermes-superagent.yaml"
      - name: A non-interactive install from the checkout goes through, install scan included
        run: |
          hermes plugins install "file://$GITHUB_WORKSPACE" --enable </dev/null
          hermes superagent --help

  e2e:
    name: e2e (${{ matrix.hermes.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        hermes:
          - { version: "0.22.7", pin: b200f5bc60e31588ba2cb60e288029c4a54ba5fa }
          - { version: "0.23.0", pin: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19 }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Hermes at the pinned release
        uses: ./.github/actions/install-hermes
        with:
          pin: ${{ matrix.hermes.pin }}
      - name: Real Hermes, fake model
        run: uv run --no-project --with pyyaml python tests/e2e/run_e2e.py --work "$RUNNER_TEMP/e2e"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: pip and uv install it into clean venvs
        run: uv run --no-project python tests/e2e/check_install.py --work "$RUNNER_TEMP/install"
      - name: Install Hermes at the latest release
        uses: ./.github/actions/install-hermes
        with:
          pin: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
      - name: Hermes finds the pip-installed plugin through its entry point
        run: |
          uv pip install --python "$RUNNER_TEMP/hermes-src/.venv/bin/python" .
          hermes plugins enable hermes-superagent
          hermes plugins list | grep hermes-superagent
          hermes superagent --help
