name: hermes-superagent
version: 0.1.0
manifest_version: 2
description: "A resident router that dispatches and never executes, isolated workers that report only to it, team-written trigger rules, and an external watchdog that checks real progress and goal drift, plus an item ledger that keeps every task, issue and Claude Code session your sources show until it's confirmed closed. Based on DeepSeek's Super-agent design. Disclosure: spawns long-running worker processes from the argv you configure, runs the outbound send command and the connector commands you configure, which read sources into its ledger, including a read-only session probe sent through the host command you configure, and, only when relaunch is turned on, types one short nudge into a stopped Claude Code session's terminal, stops or restarts its own workers, and spends tokens on the profile's model during ticks and when it writes a worker brief. Writes its database and worker directories under the configured home. Its hooks stay inert until a profile sets a role. macOS and Linux only."
author: AirKyzzZ
license: MIT
homepage: https://github.com/AirKyzzZ/hermes-superagent
tags: [orchestration, router, workers, watchdog, triggers]
requires_hermes: ">=0.22.7"
provides_tools:
  - superagent_dispatch
  - superagent_forward
  - superagent_cancel
  - superagent_status
  - superagent_report
  - superagent_tick
  - superagent_digest
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_gateway_dispatch
  - pre_llm_call
config_schema:
  role:
    type: str
    default: ""
    description: "router, worker, watchdog or empty. Empty keeps the plugin inert."
  home:
    type: str
    default: ""
    description: "Directory shared by router, workers and watchdog, holding superagent.toml and the database."
