[project]
name = "hermes-superagent"
version = "0.1.0"
description = "DeepSeek's Super-agent design as a Hermes Agent plugin"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/AirKyzzZ/hermes-superagent"
Changelog = "https://github.com/AirKyzzZ/hermes-superagent/blob/main/CHANGELOG.md"

[project.scripts]
superagent = "superagent.cli:main"
superagent-demo = "superagent.demo.run_demo:main"

[tool.setuptools]
packages = ["superagent", "superagent.agents", "superagent.connectors", "superagent.demo"]
package-dir = { "superagent.demo" = "demo" }
package-data = { "superagent.demo" = ["*.template"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
files = ["superagent"]

[[tool.mypy.overrides]]
module = ["plugins.*", "hermes_cli.*"]
ignore_missing_imports = true
